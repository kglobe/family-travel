<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c2637">
<title>大阪親子旅行 2026</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Hallmark · redesign · scope: single-page mobile app · mood: 日本車站指示牌
 * theme: custom (paper oklch(95.5% 0.007 250) · accent oklch(55% 0.2 25) warm-red
 *        display/numerals: Space Grotesk · body: system CJK gothic)
 * axes: light / grotesk-sans / warm · pre-emit critique: P4 H5 E4 S5 R4 V4
 */
:root {
  /* 站牌底色與墨色 */
  --bg: oklch(95.5% 0.007 250);
  --surface: oklch(98.5% 0.004 250);
  --rule: oklch(86% 0.012 250);
  --ink: oklch(24% 0.022 258);
  --muted: oklch(46% 0.016 255);
  /* 深色看板（駅名標 / 出發資訊板） */
  --slab: oklch(26% 0.032 255);
  --slab-ink: oklch(96% 0.006 250);
  --slab-rule: oklch(42% 0.03 255);
  /* 路線色：御堂筋紅(食)、中央綠(景點)、金(購物)、谷町紫(祭典)、灰(交通) */
  --line-red: oklch(55% 0.2 25);
  --line-green: oklch(56% 0.12 165);
  --line-gold: oklch(64% 0.12 80);
  --line-purple: oklch(52% 0.15 305);
  --line-grey: oklch(50% 0.02 255);
  --on-line: oklch(98.5% 0.004 250);
  --red-tint: oklch(94% 0.03 25);
  --green-tint: oklch(94% 0.03 165);
  --rail: oklch(78% 0.015 252);
  --font-latin: "Space Grotesk";
  --font-body: var(--font-latin), -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Hiragino Sans", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  --radius: 8px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-short: 200ms;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media(prefers-color-scheme:dark){
  :root {
    --bg: oklch(17% 0.012 252);
    --surface: oklch(21.5% 0.014 252);
    --rule: oklch(33% 0.014 252);
    --ink: oklch(92% 0.008 250);
    --muted: oklch(64% 0.012 252);
    --slab: oklch(23% 0.025 255);
    --slab-ink: oklch(94% 0.006 250);
    --slab-rule: oklch(38% 0.025 255);
    --line-red: oklch(63% 0.18 25);
    --line-green: oklch(64% 0.11 165);
    --line-gold: oklch(72% 0.11 80);
    --line-purple: oklch(62% 0.13 305);
    --line-grey: oklch(62% 0.015 255);
    --red-tint: oklch(28% 0.05 25);
    --green-tint: oklch(28% 0.05 165);
    --rail: oklch(38% 0.014 252);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);color:var(--ink);
  line-height:1.6;overflow-x:clip;
  padding-bottom:calc(68px + var(--safe-bottom));
  -webkit-tap-highlight-color:transparent;
}
button:focus-visible,a:focus-visible{
  outline:2px solid var(--line-red);outline-offset:2px;border-radius:4px;
}

/* Material Symbols */
.ms{
  font-family:'Material Symbols Rounded';
  font-weight:normal;font-style:normal;
  font-size:23px;line-height:1;
  letter-spacing:normal;text-transform:none;
  display:inline-block;white-space:nowrap;
  word-wrap:normal;direction:ltr;
  -webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
  vertical-align:middle;
  user-select:none;
}
.ms.outline{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}

/* Header — 駅名標 */
.header{
  background:var(--slab);color:var(--slab-ink);
  padding:26px 18px 0;
}
.station-name{
  font-size:33px;font-weight:800;letter-spacing:.14em;
  text-align:center;line-height:1.25;
}
.station-romaji{
  font-family:var(--font-body);font-weight:500;
  font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  text-align:center;opacity:.72;margin-top:4px;
}
.line-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--line-red);color:var(--on-line);
  margin:16px -18px 0;padding:7px 16px;
  font-weight:700;font-size:14px;letter-spacing:.06em;
  white-space:nowrap;
}
.line-bar .line-dates{font-weight:500;letter-spacing:.02em}
.header-badge{
  display:inline-flex;align-items:center;gap:7px;
  margin:14px auto 18px;
  border:1px solid var(--slab-rule);
  padding:6px 14px;border-radius:4px;
  font-size:15px;font-weight:700;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}
.header .badge-row{text-align:center}
.header-badge .ms{font-size:17px}
.header-badge .ms.takeoff{animation:takeoff 1.2s ease-in forwards}
@keyframes takeoff{
  0%{transform:translate(0,0) rotate(0);opacity:1}
  15%{transform:translate(2px,-1px) rotate(50deg);opacity:1}
  60%{transform:translate(28px,-22px) rotate(50deg);opacity:1}
  100%{transform:translate(90px,-70px) rotate(50deg);opacity:0}
}

/* Bottom nav */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);
  border-top:3px solid var(--ink);
  display:flex;z-index:100;
  padding-bottom:var(--safe-bottom);
}
.bottom-bar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0 7px;border:none;background:none;
  color:var(--muted);font-size:13px;font-weight:700;
  cursor:pointer;transition:color var(--dur-short) var(--ease-out);
  font-family:inherit;letter-spacing:.08em;
  -webkit-tap-highlight-color:transparent;
}
.bottom-bar button .ms{
  font-size:25px;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
}
.bottom-bar button.active{
  color:var(--line-red);
  box-shadow:inset 0 3px 0 var(--line-red);
}
.bottom-bar button.active .ms{
  font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
}

/* Day pills — 月台牌 */
.day-nav{
  display:flex;gap:8px;padding:14px 16px 6px;
  overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.day-nav::-webkit-scrollbar{display:none}
.day-pill{
  flex-shrink:0;padding:6px 12px;border-radius:6px;
  border:2px solid var(--ink);background:var(--surface);
  font-size:15px;font-weight:700;cursor:pointer;
  transition:background var(--dur-short) var(--ease-out),
             color var(--dur-short) var(--ease-out);
  white-space:nowrap;
  color:var(--ink);font-family:inherit;
  font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
}
.day-pill.active{
  background:var(--ink);color:var(--surface);border-color:var(--ink);
}

/* Sections */
.tab-content{display:none;padding:6px 14px 24px;min-height:60vh}
.tab-content.active{display:block;animation:fadeUp .3s var(--ease-out)}

/* Cards — 路線圖車站 */
.card{
  position:relative;
  background:var(--surface);border-radius:var(--radius);
  padding:12px 14px;margin:0 0 10px 28px;
  border:1px solid var(--rule);
  animation:fadeUp .4s var(--ease-out) both;
}
.card::before{ /* 路線軌 */
  content:'';position:absolute;left:-19px;top:-10px;bottom:-10px;
  width:3px;background:var(--rail);
}
.day-header + .card::before{top:20px}
.card:last-child::before{bottom:auto;height:30px}
.day-header + .card:last-child::before{display:none}
.card::after{ /* 車站點 */
  content:'';position:absolute;left:-25px;top:14px;
  width:15px;height:15px;border-radius:50%;
  background:var(--surface);border:3px solid var(--line-grey);
}
.card.food::after{border-color:var(--line-red)}
.card.attraction::after{border-color:var(--line-green)}
.card.shopping::after{border-color:var(--line-gold)}
.card.festival::after{border-color:var(--line-purple)}

.card-header{display:flex;align-items:flex-start;gap:10px}
.card-icon{
  flex-shrink:0;margin-top:2px;
  width:32px;height:32px;border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--line-grey);color:var(--on-line);
  font-size:20px;
}
.card.food .card-icon{background:var(--line-red)}
.card.attraction .card-icon{background:var(--line-green)}
.card.shopping .card-icon{background:var(--line-gold)}
.card.festival .card-icon{background:var(--line-purple)}
.card-body{flex:1;min-width:0}
.card-title{font-size:17px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.card-time{
  font-size:15px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:.04em;
  border-bottom:2px solid var(--line-red);
  display:inline-block;margin-bottom:4px;
}
.card-note{font-size:15px;color:var(--muted);margin-top:3px;line-height:1.5}
.card-sub{
  margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);
  font-size:15px;
}
.card-sub-item{
  display:flex;align-items:center;gap:6px;
  padding:3px 0;color:var(--ink);
}
.card-sub-item::before{content:'·';color:var(--muted);font-weight:bold}
.card-sub-item>span{flex:1;min-width:0}

.map-link{
  display:inline-flex;align-items:center;gap:3px;
  color:var(--line-green);font-size:15px;font-weight:700;
  text-decoration:none;padding:5px 12px;margin-top:8px;
  background:var(--green-tint);border-radius:6px;
  transition:opacity .15s var(--ease-out);
}
.map-link:active{opacity:.7}
.map-link .ms{font-size:17px}
.map-link.mini{margin:0;padding:5px 8px;flex-shrink:0}

.reserve-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--red-tint);color:var(--line-red);
  border:1px dashed var(--line-red);
  padding:3px 10px;border-radius:4px;font-size:14px;
  font-weight:700;margin-top:6px;
}
.reserve-badge .ms{font-size:16px}

/* Section headers — 訊號牌標籤 */
.section-title{
  font-size:13px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.18em;
  padding:18px 4px 8px;
  display:flex;align-items:center;gap:8px;
}
.section-title::before{
  content:'';width:14px;height:4px;background:var(--line-red);
}

/* Checklist */
.check-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:11px 14px;margin-bottom:6px;
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--radius);
  cursor:pointer;transition:opacity var(--dur-short) var(--ease-out);
  -webkit-tap-highlight-color:transparent;
  animation:fadeUp .3s var(--ease-out) both;
}
.check-item.checked{opacity:.5}
.check-item.checked .check-label{text-decoration:line-through}
.check-box{
  width:22px;height:22px;border-radius:4px;flex-shrink:0;
  border:2px solid var(--ink);display:flex;
  align-items:center;justify-content:center;
  transition:background var(--dur-short) var(--ease-out),
             border-color var(--dur-short) var(--ease-out);
  margin-top:1px;
}
.check-item.checked .check-box{
  background:var(--line-green);border-color:var(--line-green);
}
.check-box .ms{
  font-size:16px;color:var(--on-line);
  opacity:0;transform:scale(0);
  transition:opacity var(--dur-short) var(--ease-out),
             transform var(--dur-short) var(--ease-out);
}
.check-item.checked .check-box .ms{opacity:1;transform:scale(1)}
.check-label{font-size:16px;line-height:1.5}
.check-category{
  font-size:16px;font-weight:700;padding:14px 4px 8px;
  color:var(--ink);display:flex;align-items:center;gap:6px;
  letter-spacing:.04em;
}
.check-category .ms{font-size:20px;color:var(--muted)}

/* Shopping items */
.shop-card{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--radius);
  padding:11px 14px;margin-bottom:8px;
  animation:fadeUp .3s var(--ease-out) both;
}
.shop-name{font-size:16px;font-weight:700}
.shop-detail{font-size:15px;color:var(--muted);margin-top:2px}

/* Notes section */
.note-card{
  background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--radius);
  padding:15px;margin-bottom:12px;
  animation:fadeUp .3s var(--ease-out) both;
}
.note-card h3{
  font-size:17px;font-weight:700;margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
  border-bottom:2px solid var(--ink);padding-bottom:6px;
}
.note-card h3 .ms{font-size:20px;color:var(--line-red)}
.note-card p,.note-card li{font-size:16px;line-height:1.7;color:var(--ink)}
.note-card ul{padding-left:18px}
.note-card li{margin-bottom:4px}
.note-card a{color:var(--line-green);text-decoration:underline;font-weight:600}

/* Expense table */
.expense-table{width:100%;border-collapse:collapse;font-size:16px;margin-top:8px}
.expense-table td{padding:8px 4px;border-bottom:1px solid var(--rule)}
.expense-table td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* Laundry table */
.laundry-grid{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;
  font-size:13px;text-align:center;margin-top:8px;
  font-variant-numeric:tabular-nums;
}
.laundry-grid .lh{font-weight:700;padding:5px 1px;color:var(--muted)}
.laundry-grid .lc{
  padding:5px 1px;background:var(--bg);border:1px solid var(--rule);
  border-radius:4px;font-size:13px;
}

/* Animations */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}

/* Day header */
.day-header{
  padding:10px 4px 8px;display:flex;align-items:baseline;gap:10px;
}
.day-header-date{
  font-size:21px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  border-bottom:3px solid var(--ink);padding-bottom:2px;
}

/* 寬螢幕 / 瀏覽器誤開「電腦版網站」時：置中成手機 App 版面 */
@media(min-width:600px){
  .header,main{max-width:520px;margin:0 auto}
  .bottom-bar{max-width:520px;left:50%;transform:translateX(-50%);
    border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
}

/* Galaxy S25 等窄螢幕 (~360px) */
@media(max-width:374px){
  .header{padding:22px 16px 0}
  .station-name{font-size:28px;letter-spacing:.1em}
  .line-bar{font-size:13px}
  .tab-content{padding:6px 12px 24px}
  .card{padding:11px 12px;margin-left:26px}
  .card-title{font-size:16px}
  .day-pill{padding:5px 10px;font-size:14.5px}
  .laundry-grid{font-size:12px}
  .laundry-grid .lc{font-size:12px}
}
</style>
</head>
<body>

<div class="header">
  <div class="station-name">大阪親子旅行</div>
  <div class="station-romaji">Osaka Family Trip 2026</div>
  <div class="line-bar">
    <span>◀ 前鎮</span>
    <span class="line-dates">07.25 六 — 07.30 四 · 6天5夜</span>
    <span>難波 ▶</span>
  </div>
  <div class="badge-row"><div class="header-badge" id="countdown"></div></div>
</div>

<main>
  <!-- 行程 -->
  <div class="tab-content active" id="tab-itinerary">
    <div class="day-nav" id="dayNav"></div>
    <div id="dayContent"></div>
  </div>

  <!-- 購物 -->
  <div class="tab-content" id="tab-shopping">
    <div class="section-title">購物清單</div>
    <div id="shopContent"></div>
  </div>

  <!-- 行李 -->
  <div class="tab-content" id="tab-packing">
    <div class="section-title">行李清單</div>
    <div id="packContent"></div>
  </div>

  <!-- 備忘 -->
  <div class="tab-content" id="tab-notes">
    <div class="section-title">旅行備忘</div>
    <div id="notesContent"></div>
  </div>
</main>

<nav class="bottom-bar">
  <button class="active" data-tab="itinerary"><span class="ms">calendar_month</span>行程</button>
  <button data-tab="shopping"><span class="ms">shopping_bag</span>購物</button>
  <button data-tab="packing"><span class="ms">luggage</span>行李</button>
  <button data-tab="notes"><span class="ms">checklist</span>備忘</button>
</nav>

// --- RENDER ---
function h(tag,props,...ch){
  const el=document.createElement(tag);
  if(props)Object.entries(props).forEach(([k,v])=>{
    if(k==='className')el.className=v;
    else if(k==='innerHTML')el.innerHTML=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  });
  ch.flat().forEach(c=>{if(c)el.append(typeof c==='string'?document.createTextNode(c):c)});
  return el;
}
function icon(name,cls){return h('span',{className:'ms'+(cls?' '+cls:'')},name)}

function renderDayNav(){
  const nav=document.getElementById('dayNav');
  DAYS.forEach((d,i)=>{
    const pill=h('button',{className:'day-pill'+(i===0?' active':''),onClick:()=>switchDay(i)},
      d.date+'('+d.weekday+')');
    pill.dataset.day=i;
    nav.appendChild(pill);
  });
}

function switchDay(idx){
  document.querySelectorAll('.day-pill').forEach((p,i)=>p.classList.toggle('active',i===idx));
  renderDay(idx);
  document.querySelectorAll('.day-pill')[idx]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

function renderDay(idx){
  const wrap=document.getElementById('dayContent');
  wrap.innerHTML='';
  const d=DAYS[idx];
  wrap.appendChild(h('div',{className:'day-header'},
    h('div',{className:'day-header-date'},d.date+' ('+d.weekday+')'),
  ));

  d.items.forEach((item,i)=>{
    const card=h('div',{className:'card '+(item.type||'')});
    card.style.animationDelay=(i*60)+'ms';
    const header=h('div',{className:'card-header'});
    header.appendChild(icon(item.icon||'location_on','card-icon'));
    const body=h('div',{className:'card-body'});
    if(item.time)body.appendChild(h('div',{className:'card-time'},item.time));
    body.appendChild(h('div',{className:'card-title'},item.name));
    if(item.note)body.appendChild(h('div',{className:'card-note'},item.note));
    if(item.reserve){
      body.appendChild(h('div',{className:'reserve-badge'},icon('event_available'),item.reserve));
    }
    if(item.map){
      body.appendChild(h('a',{className:'map-link',href:item.map,target:'_blank',rel:'noopener'},
        icon('location_on'),'開啟地圖'));
    }
    if(item.pdf){
      body.appendChild(h('a',{className:'map-link',href:item.pdf,target:'_blank',rel:'noopener'},
        icon('picture_as_pdf'),'預訂 PDF'));
    }
    if(item.link){
      body.appendChild(h('a',{className:'map-link',href:item.link,target:'_blank',rel:'noopener'},
        icon('open_in_new'),'南海電鐵指南'));
    }
    if(item.subs&&item.subs.length){
      const sub=h('div',{className:'card-sub'});
      item.subs.forEach(s=>{
        const si=h('div',{className:'card-sub-item'});
        si.appendChild(h('span',null,s.name));
        if(s.map){
          si.appendChild(h('a',{className:'map-link mini',href:s.map,target:'_blank',rel:'noopener'},
            icon('location_on')));
        }
        sub.appendChild(si);
      });
      body.appendChild(sub);
    }
    header.appendChild(body);
    card.appendChild(header);
    wrap.appendChild(card);
  });
}

function renderPacking(){
  const wrap=document.getElementById('packContent');
  const stored=JSON.parse(localStorage.getItem('pack-checks')||'{}');

  function addSection(iconName,title,items,prefix){
    wrap.appendChild(h('div',{className:'check-category'},icon(iconName),title));
    items.forEach((item,i)=>{
      const key=prefix+i;
      const el=h('div',{className:'check-item'+(stored[key]?' checked':''),
        onClick:()=>{
          el.classList.toggle('checked');
          const s=JSON.parse(localStorage.getItem('pack-checks')||'{}');
          s[key]=el.classList.contains('checked');
          localStorage.setItem('pack-checks',JSON.stringify(s));
        }});
      el.style.animationDelay=(i*30)+'ms';
      el.appendChild(h('div',{className:'check-box'},icon('check')));
      el.appendChild(h('div',{className:'check-label'},item));
      wrap.appendChild(el);
    });
  }
  addSection('backpack','隨身背包',PACKING_BACKPACK,'bp-');
  addSection('luggage','行李箱',PACKING_SUITCASE,'sc-');
}

// --- COUNTDOWN ---
function updateCountdown(){
  const start=new Date('2026-07-25T08:30:00+08:00');
  const back=new Date('2026-07-30T13:45:00+09:00');
  const end=new Date('2026-07-30T23:59:59+08:00');
  const now=new Date();
  const el=document.getElementById('countdown');
  el.innerHTML='';
  const makePlane=()=>{
    const plane=icon('flight');
    el.style.cursor='pointer';
    el.onclick=()=>{
      if(plane.classList.contains('takeoff'))return;
      plane.classList.add('takeoff');
      plane.addEventListener('animationend',()=>plane.classList.remove('takeoff'),{once:true});
    };
    return plane;
  };
  if(now<start){
    const diff=Math.ceil((start-now)/(1000*60*60*24));
    const sameDay=start-now<1000*60*60*24&&now.getDate()===start.getDate();
    el.append(makePlane(),sameDay?'今天出發！KHH 08:30 起飛':'距離出發還有 '+diff+' 天');
  }else if(now<back&&now.getDate()===back.getDate()){
    el.append(makePlane(),'今天回台灣！KIX 13:45 起飛');
  }else if(now<=end){
    el.append(icon('celebration'),'旅途愉快！享受大阪吧');
  }else{
    el.append(icon('photo_camera'),'美好回憶');
  }
}

function autoSelectDay(){
  const now=new Date();
  const dayMap={25:0,26:1,27:2,28:3,29:4,30:5};
  if(now.getFullYear()===2026&&now.getMonth()===6&&dayMap[now.getDate()]!==undefined){
    switchDay(dayMap[now.getDate()]);
  }
}
