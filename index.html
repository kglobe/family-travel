<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#00549e">
<title>大阪親子旅行 2026</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=block" rel="stylesheet">
<style>
:root {
  /* 大阪代表色：澪標藍(市章)、道頓堀紅、大阪城青銅綠、金鯱金 */
  --bg: #f6f8fa;
  --surface: #ffffff;
  --surface-alt: #e9eef3;
  --text: #16324f;
  --text-muted: #64748b;
  --accent: #d7263d;
  --accent-light: #fdecee;
  --teal: #2e7d63;
  --teal-light: #e7f3ee;
  --gold: #b8912f;
  --gold-light: #fbf4e0;
  --navy: #16324f;
  --radius: 14px;
  --ease: cubic-bezier(.4,0,.2,1);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media(prefers-color-scheme:dark){
  :root {
    --bg: #0f141c;
    --surface: #1a212c;
    --surface-alt: #242e3b;
    --text: #e4e9ee;
    --text-muted: #8b98a8;
    --accent: #ef4b5e;
    --accent-light: #2b171b;
    --teal: #3fa382;
    --teal-light: #14261f;
    --gold: #e0b13a;
    --gold-light: #262012;
    --navy: #e4e9ee;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans CJK TC",sans-serif;
  background:var(--bg);color:var(--text);
  line-height:1.6;overflow-x:hidden;
  padding-bottom:calc(68px + var(--safe-bottom));
  -webkit-tap-highlight-color:transparent;
}

/* Material Symbols */
.ms{
  font-family:'Material Symbols Rounded';
  font-weight:normal;font-style:normal;
  font-size:22px;line-height:1;
  letter-spacing:normal;text-transform:none;
  display:inline-block;white-space:nowrap;
  word-wrap:normal;direction:ltr;
  -webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
  vertical-align:middle;
  user-select:none;
}
.ms.outline{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}

/* Header */
.header{
  background:linear-gradient(135deg,#00427e 0%,#0079c2 100%);
  color:#fff;padding:32px 18px 26px;
  position:relative;overflow:hidden;
}
@media(prefers-color-scheme:dark){
  .header{background:linear-gradient(135deg,#0a1826 0%,#00427e 100%)}
}
.header::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;height:20px;
  background:var(--bg);border-radius:20px 20px 0 0;
}
.header-eyebrow{
  font-size:12px;letter-spacing:2px;opacity:.7;
  text-transform:uppercase;margin-bottom:4px;
}
.header-title{font-size:28px;font-weight:800;letter-spacing:1px;line-height:1.2}
.header-title span{color:#ffd25e}
.header-dates{font-size:13px;opacity:.75;margin-top:6px;font-weight:500}
.header-badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;
}
.header-badge .ms{font-size:16px}

/* Bottom nav */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);
  border-top:1px solid var(--surface-alt);
  display:flex;z-index:100;
  padding-bottom:var(--safe-bottom);
}
.bottom-bar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0 7px;border:none;background:none;
  color:var(--text-muted);font-size:11px;font-weight:600;
  cursor:pointer;transition:color .2s var(--ease);
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}
.bottom-bar button .ms{
  font-size:24px;transition:transform .2s var(--ease);
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
}
.bottom-bar button.active{color:var(--accent)}
.bottom-bar button.active .ms{
  transform:scale(1.1);
  font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
}

/* Day pills */
.day-nav{
  display:flex;gap:6px;padding:14px 16px 6px;
  overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.day-nav::-webkit-scrollbar{display:none}
.day-pill{
  flex-shrink:0;padding:7px 13px;border-radius:20px;
  border:1.5px solid var(--surface-alt);background:var(--surface);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:all .25s var(--ease);white-space:nowrap;
  color:var(--text);font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}
.day-pill.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 4px 12px rgba(215,38,61,.3);
}

/* Sections */
.tab-content{display:none;padding:6px 14px 24px;min-height:60vh}
.tab-content.active{display:block;animation:fadeUp .35s var(--ease)}

/* Cards */
.card{
  background:var(--surface);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;
  border-left:4px solid var(--surface-alt);
  box-shadow:0 1px 3px rgba(0,0,0,.04);
  transition:transform .15s var(--ease);
  animation:fadeUp .4s var(--ease) both;
}
.card:active{transform:scale(.985)}
.card.food{border-left-color:var(--accent)}
.card.attraction{border-left-color:var(--teal)}
.card.shopping{border-left-color:var(--gold)}
.card.transport{border-left-color:var(--text-muted)}
.card.festival{border-left-color:#9b59b6}

.card-header{display:flex;align-items:flex-start;gap:10px}
.card-icon{flex-shrink:0;margin-top:2px;color:var(--text-muted)}
.card.food .card-icon{color:var(--accent)}
.card.attraction .card-icon{color:var(--teal)}
.card.shopping .card-icon{color:var(--gold)}
.card.festival .card-icon{color:#9b59b6}
.card-body{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:700;line-height:1.35}
.card-time{
  font-size:12px;font-weight:700;color:var(--accent);
  background:var(--accent-light);padding:2px 8px;border-radius:8px;
  display:inline-block;margin-bottom:4px;
}
.card-note{font-size:13px;color:var(--text-muted);margin-top:3px;line-height:1.5}
.card-sub{
  margin-top:8px;padding-top:8px;border-top:1px solid var(--surface-alt);
  font-size:13px;
}
.card-sub-item{
  display:flex;align-items:center;gap:6px;
  padding:3px 0;color:var(--text);
}
.card-sub-item::before{content:'·';color:var(--text-muted);font-weight:bold}
.card-sub-item>span{flex:1;min-width:0}

.map-link{
  display:inline-flex;align-items:center;gap:3px;
  color:var(--teal);font-size:13px;font-weight:600;
  text-decoration:none;padding:6px 12px;margin-top:8px;
  background:var(--teal-light);border-radius:10px;
  transition:opacity .15s;
}
.map-link:active{opacity:.7}
.map-link .ms{font-size:16px}
.map-link.mini{margin:0;padding:5px 8px;flex-shrink:0}

.reserve-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--accent-light);color:var(--accent);
  padding:4px 10px;border-radius:8px;font-size:12px;
  font-weight:700;margin-top:6px;
  animation:pulse 2.5s ease-in-out infinite;
}
.reserve-badge .ms{font-size:15px}

/* Section headers */
.section-title{
  font-size:12px;font-weight:700;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:1.5px;
  padding:18px 4px 8px;
}

/* Checklist */
.check-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 14px;margin-bottom:6px;
  background:var(--surface);border-radius:var(--radius);
  cursor:pointer;transition:opacity .2s;
  -webkit-tap-highlight-color:transparent;
  animation:fadeUp .35s var(--ease) both;
}
.check-item.checked{opacity:.5}
.check-item.checked .check-label{text-decoration:line-through}
.check-box{
  width:22px;height:22px;border-radius:6px;flex-shrink:0;
  border:2px solid var(--surface-alt);display:flex;
  align-items:center;justify-content:center;
  transition:all .2s var(--ease);margin-top:1px;
}
.check-item.checked .check-box{
  background:var(--teal);border-color:var(--teal);
}
.check-box .ms{
  font-size:15px;color:#fff;
  opacity:0;transform:scale(0);transition:all .2s var(--ease);
}
.check-item.checked .check-box .ms{opacity:1;transform:scale(1)}
.check-label{font-size:14px;line-height:1.5}
.check-category{
  font-size:14px;font-weight:700;padding:14px 4px 8px;
  color:var(--text);display:flex;align-items:center;gap:6px;
}
.check-category .ms{font-size:19px;color:var(--text-muted)}

/* Shopping items */
.shop-card{
  background:var(--surface);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;
  animation:fadeUp .35s var(--ease) both;
}
.shop-name{font-size:14px;font-weight:600}
.shop-detail{font-size:13px;color:var(--text-muted);margin-top:2px}

/* Notes section */
.note-card{
  background:var(--surface);border-radius:var(--radius);
  padding:15px;margin-bottom:12px;
  animation:fadeUp .35s var(--ease) both;
}
.note-card h3{
  font-size:15px;font-weight:700;margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.note-card h3 .ms{font-size:19px;color:var(--accent)}
.note-card p,.note-card li{font-size:14px;line-height:1.7;color:var(--text)}
.note-card ul{padding-left:18px}
.note-card li{margin-bottom:4px}
.note-card a{color:var(--teal);text-decoration:none;font-weight:500}

/* Expense table */
.expense-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.expense-table td{padding:8px 4px;border-bottom:1px solid var(--surface-alt)}
.expense-table td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* Laundry table */
.laundry-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:3px;
  font-size:11px;text-align:center;margin-top:8px;
}
.laundry-grid .lh{font-weight:700;padding:5px 1px;color:var(--text-muted)}
.laundry-grid .lc{
  padding:5px 1px;background:var(--surface-alt);border-radius:6px;
  font-size:11px;
}

/* Animations */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.7}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}

/* Day header */
.day-header{
  padding:10px 4px 4px;display:flex;align-items:baseline;gap:10px;
}
.day-header-date{font-size:20px;font-weight:800}

/* 寬螢幕 / 瀏覽器誤開「電腦版網站」時：置中成手機 App 版面 */
@media(min-width:600px){
  .header,main{max-width:520px;margin:0 auto}
  .header{border-radius:0 0 0 0}
  .bottom-bar{max-width:520px;left:50%;transform:translateX(-50%);
    border-left:1px solid var(--surface-alt);border-right:1px solid var(--surface-alt);
    border-radius:16px 16px 0 0}
}

/* Galaxy S25 等窄螢幕 (~360px) */
@media(max-width:374px){
  .header{padding:26px 16px 22px}
  .header-title{font-size:25px}
  .tab-content{padding:6px 12px 24px}
  .card{padding:12px}
  .card-title{font-size:14px}
  .day-pill{padding:6px 11px;font-size:12.5px}
  .laundry-grid{font-size:10px}
  .laundry-grid .lc{font-size:10px}
}
</style>
</head>

// --- RENDER ---
function h(tag,props,...ch){
  const el=document.createElement(tag);
  if(props)Object.entries(props).forEach(([k,v])=>{
    if(k==='className')el.className=v;
    else if(k==='innerHTML')el.innerHTML=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  });
  ch.flat().forEach(c=>{if(c)el.append(typeof c==='string'?document.createTextNode(c):c)});
  return el;
}
function icon(name,cls){return h('span',{className:'ms'+(cls?' '+cls:'')},name)}

function renderDayNav(){
  const nav=document.getElementById('dayNav');
  DAYS.forEach((d,i)=>{
    const pill=h('button',{className:'day-pill'+(i===0?' active':''),onClick:()=>switchDay(i)},
      d.date+'('+d.weekday+')');
    pill.dataset.day=i;
    nav.appendChild(pill);
  });
}

function switchDay(idx){
  document.querySelectorAll('.day-pill').forEach((p,i)=>p.classList.toggle('active',i===idx));
  renderDay(idx);
  document.querySelectorAll('.day-pill')[idx]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

function renderDay(idx){
  const wrap=document.getElementById('dayContent');
  wrap.innerHTML='';
  const d=DAYS[idx];
  wrap.appendChild(h('div',{className:'day-header'},
    h('div',{className:'day-header-date'},d.date+' ('+d.weekday+')'),
  ));

  d.items.forEach((item,i)=>{
    const card=h('div',{className:'card '+(item.type||'')});
    card.style.animationDelay=(i*60)+'ms';
    const header=h('div',{className:'card-header'});
    header.appendChild(icon(item.icon||'location_on','card-icon'));
    const body=h('div',{className:'card-body'});
    if(item.time)body.appendChild(h('div',{className:'card-time'},item.time));
    body.appendChild(h('div',{className:'card-title'},item.name));
    if(item.note)body.appendChild(h('div',{className:'card-note'},item.note));
    if(item.reserve){
      body.appendChild(h('div',{className:'reserve-badge'},icon('event_available'),item.reserve));
    }
    if(item.map){
      body.appendChild(h('a',{className:'map-link',href:item.map,target:'_blank',rel:'noopener'},
        icon('location_on'),'開啟地圖'));
    }
    if(item.subs&&item.subs.length){
      const sub=h('div',{className:'card-sub'});
      item.subs.forEach(s=>{
        const si=h('div',{className:'card-sub-item'});
        si.appendChild(h('span',null,s.name));
        if(s.map){
          si.appendChild(h('a',{className:'map-link mini',href:s.map,target:'_blank',rel:'noopener'},
            icon('location_on')));
        }
        sub.appendChild(si);
      });
      body.appendChild(sub);
    }
    header.appendChild(body);
    card.appendChild(header);
    wrap.appendChild(card);
  });
}

function renderShopping(){
  const wrap=document.getElementById('shopContent');
  SHOPPING.forEach(cat=>{
    wrap.appendChild(h('div',{className:'check-category'},icon('sell'),cat.cat));
    cat.items.forEach((item,i)=>{
      const card=h('div',{className:'shop-card'});
      card.style.animationDelay=(i*40)+'ms';
      card.appendChild(h('div',{className:'shop-name'},item.name));
      if(item.detail)card.appendChild(h('div',{className:'shop-detail'},item.detail));
      wrap.appendChild(card);
    });
  });
}

function renderPacking(){
  const wrap=document.getElementById('packContent');
  const stored=JSON.parse(localStorage.getItem('pack-checks')||'{}');

  function addSection(iconName,title,items,prefix){
    wrap.appendChild(h('div',{className:'check-category'},icon(iconName),title));
    items.forEach((item,i)=>{
      const key=prefix+i;
      const el=h('div',{className:'check-item'+(stored[key]?' checked':''),
        onClick:()=>{
          el.classList.toggle('checked');
          const s=JSON.parse(localStorage.getItem('pack-checks')||'{}');
          s[key]=el.classList.contains('checked');
          localStorage.setItem('pack-checks',JSON.stringify(s));
        }});
      el.style.animationDelay=(i*30)+'ms';
      el.appendChild(h('div',{className:'check-box'},icon('check')));
      el.appendChild(h('div',{className:'check-label'},item));
      wrap.appendChild(el);
    });
  }
  addSection('backpack','隨身背包',PACKING_BACKPACK,'bp-');
  addSection('luggage','行李箱',PACKING_SUITCASE,'sc-');
}

// --- TAB SWITCHING ---
document.querySelectorAll('.bottom-bar button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.bottom-bar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

// --- COUNTDOWN ---
function updateCountdown(){
  const start=new Date('2026-07-25T00:00:00+08:00');
  const end=new Date('2026-07-30T23:59:59+08:00');
  const now=new Date();
  const el=document.getElementById('countdown');
  el.innerHTML='';
  if(now<start){
    const diff=Math.ceil((start-now)/(1000*60*60*24));
    el.append(icon('flight'),'距離出發還有 '+diff+' 天');
  }else if(now<=end){
    el.append(icon('celebration'),'旅途愉快！享受大阪吧');
  }else{
    el.append(icon('photo_camera'),'美好回憶');
  }
}

// --- AUTO DAY ---
function autoSelectDay(){
  const now=new Date();
  const dayMap={25:0,26:1,27:2,28:3,29:4,30:5};
  if(now.getFullYear()===2026&&now.getMonth()===6&&dayMap[now.getDate()]!==undefined){
    switchDay(dayMap[now.getDate()]);
  }
}
